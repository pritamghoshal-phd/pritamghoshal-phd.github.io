<text class="s-txt" x="58" y="56" text-anchor="start" style="font-size:22px" font-weight="600">one oscillator of the analogue reservoir</text>
<text class="s-txt s-txt--sm" x="58" y="74" text-anchor="start" style="font-size:12px">three op-amps, two four-quadrant multipliers</text>
<text class="s-mono" x="150" y="104" text-anchor="start" style="font-size:11px">Y₀ cos ΩT</text>
<text class="s-mono" x="173" y="138" text-anchor="middle" style="font-size:12px">aⱼ</text>
<text class="s-mono" x="60" y="194" text-anchor="start" style="font-size:11px">qⱼ₋₁ , qⱼ₊₁</text>
<text class="s-mono" x="262" y="100" text-anchor="middle" style="font-size:11px">Rₑ</text>
<text class="s-mono" x="262" y="146" text-anchor="middle" style="font-size:11px">Rᵤ</text>
<text class="s-mono" x="262" y="192" text-anchor="middle" style="font-size:11px">Rᶜ</text>
<text class="s-mono" x="262" y="238" text-anchor="middle" style="font-size:11px">Rₐ → gain 2</text>
<text class="s-mono" x="262" y="284" text-anchor="middle" style="font-size:11px">R_c → gain 100</text>
<text class="s-mono" x="262" y="330" text-anchor="middle" style="font-size:11px">R_b → gain 30</text>
<text class="s-mono" x="420" y="372" text-anchor="middle" style="font-size:11px">R_f</text>
<text class="s-mono" x="556" y="227" text-anchor="middle" style="font-size:11px">R</text>
<text class="s-mono" x="786" y="227" text-anchor="middle" style="font-size:11px">R</text>
<text class="s-mono" x="645" y="150" text-anchor="middle" style="font-size:11px">C</text>
<text class="s-mono" x="875" y="150" text-anchor="middle" style="font-size:11px">C</text>
<text class="s-mono" x="645" y="108" text-anchor="middle" style="font-size:11px">R_p</text>
<text class="s-txt s-txt--sm" x="686" y="108" text-anchor="start" style="font-size:11px">sets the damping</text>
<text class="s-mono" x="510" y="300" text-anchor="middle" style="font-size:12px">τ = RC</text>
<text class="s-mono" x="740" y="300" text-anchor="middle" style="font-size:12px">τ = RC</text>
<text class="s-mono" x="960" y="238" text-anchor="middle" style="font-size:15px">qⱼ</text>
<text class="s-mono" x="1150" y="238" text-anchor="middle" style="font-size:11px">to dSPACE 1104</text>
<text class="s-txt s-txt--sm" x="1150" y="290" text-anchor="middle" style="font-size:11px">and to qⱼ₋₁ , qⱼ₊₁</text>
<text class="s-mono" x="926" y="402" text-anchor="end" style="font-size:11px">X</text>
<text class="s-mono" x="926" y="436" text-anchor="end" style="font-size:11px">Y</text>
<text class="s-mono" x="834" y="419" text-anchor="start" style="font-size:11px">W</text>
<text class="s-mono" x="926" y="522" text-anchor="end" style="font-size:11px">X</text>
<text class="s-mono" x="926" y="556" text-anchor="end" style="font-size:11px">Y</text>
<text class="s-mono" x="834" y="539" text-anchor="start" style="font-size:11px">W</text>
<text class="s-mono" x="500" y="408" text-anchor="middle" style="font-size:12px">−q²/10</text>
<text class="s-mono" x="500" y="528" text-anchor="middle" style="font-size:12px">+q³/100</text>
<text class="s-mono" x="500" y="593" text-anchor="middle" style="font-size:12px">qⱼ</text>
<rect x="1012" y="96" width="226" height="118" rx="8" class="s-card"/>
<text class="s-txt" x="1026" y="120" text-anchor="start" style="font-size:12px" font-weight="600">why 2 / 30 / 100</text>
<text class="s-mono" x="1026" y="142" text-anchor="start" style="font-size:10px">W = (X₁−X₂)(Y₁−Y₂)/10V</text>
<text class="s-mono" x="1026" y="160" text-anchor="start" style="font-size:10px">the /10 V scales every</text>
<text class="s-mono" x="1026" y="176" text-anchor="start" style="font-size:10px">product: q²/10, q³/100.</text>
<text class="s-mono" x="1026" y="192" text-anchor="start" style="font-size:10px">Gains 30, 100 undo it.</text>
<rect x="58" y="630" width="1154" height="56" rx="8" class="s-card"/>
<text class="s-mono" x="78" y="655" text-anchor="start" style="font-size:13px">A1:  −[ 2·q  +  30·(−q²/10)  +  100·(+q³/100) ]  =  −2q + 3q² − q³</text>
<text class="s-txt s-txt--sm" x="78" y="675" text-anchor="start" style="font-size:12px">two inverting integrators:  q″ = Vₐ₁/τ²   →   τ²q″ + (τ²/R_pC)q′ = −2q + 3q² − q³ + coupling + carrier</text>
</svg>
